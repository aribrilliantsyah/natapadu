name: Build & Release

# macOS sengaja belum diaktifkan — ditambahkan menyusul.
on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: '22'

jobs:
  # Verifikasi cepat sebelum build panjang: gagal di sini artinya artefaknya
  # tidak perlu dibangun sama sekali.
  test:
    name: Test & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod   # satu sumber kebenaran, ikut go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./backend/... -timeout 5m

      - name: Svelte typecheck
        working-directory: ./frontend
        run: npm run check

  linux:
    name: Linux AppImage (x86_64)
    needs: test
    runs-on: ubuntu-22.04   # glibc lebih tua = AppImage jalan di distro lebih banyak
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod   # satu sumber kebenaran, ikut go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            fuse libfuse2 file desktop-file-utils

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Tentukan versi
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build binary
        run: |
          wails build -platform linux/amd64 -tags webkit2_41 -clean -v 2 \
            -ldflags "-X main.Version=${{ steps.ver.outputs.version }}"

      - name: Assemble AppDir
        run: |
          set -euo pipefail
          APPDIR=build/appimage/Natapadu.AppDir
          mkdir -p "$APPDIR/usr/bin" \
                   "$APPDIR/usr/share/applications" \
                   "$APPDIR/usr/share/icons/hicolor/512x512/apps"

          cp build/bin/natapadu-app "$APPDIR/usr/bin/natapadu"
          chmod +x "$APPDIR/usr/bin/natapadu"

          cp build/appicon.png "$APPDIR/usr/share/icons/hicolor/512x512/apps/natapadu.png"
          cp build/appicon.png "$APPDIR/natapadu.png"

          cat > "$APPDIR/natapadu.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Natapadu
          Comment=Navigasi Master Data dan Alat Terpadu
          Exec=natapadu
          Icon=natapadu
          Categories=Office;Spreadsheet;
          Terminal=false
          DESKTOP
          cp "$APPDIR/natapadu.desktop" "$APPDIR/usr/share/applications/natapadu.desktop"
          desktop-file-validate "$APPDIR/natapadu.desktop"

          # AppRun harus dapat dieksekusi, kalau tidak AppImage-nya gagal jalan
          cat > "$APPDIR/AppRun" <<'APPRUN'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/natapadu" "$@"
          APPRUN
          chmod +x "$APPDIR/AppRun"

      - name: Build AppImage
        run: |
          set -euo pipefail
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          # Runner tanpa FUSE: jalankan appimagetool dari isi arsipnya
          ./appimagetool --appimage-extract > /dev/null
          ARCH=x86_64 ./squashfs-root/AppRun \
            build/appimage/Natapadu.AppDir \
            build/bin/Natapadu-x86_64.AppImage
          chmod +x build/bin/Natapadu-x86_64.AppImage
          ls -lh build/bin/

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: natapadu-linux-x86_64-appimage
          path: build/bin/Natapadu-x86_64.AppImage
          if-no-files-found: error

  windows:
    name: Windows x64
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod   # satu sumber kebenaran, ikut go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Tentukan versi
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build binary
        run: wails build -platform windows/amd64 -clean -v 2 -ldflags "-X main.Version=${{ steps.ver.outputs.version }}"

      - name: Rename output
        shell: pwsh
        run: |
          $exe = Get-ChildItem build/bin -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "Tidak ada .exe di build/bin" }
          Rename-Item $exe.FullName "Natapadu-windows-amd64.exe"
          Get-ChildItem build/bin

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: natapadu-windows-amd64
          path: build/bin/Natapadu-windows-amd64.exe
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR dist

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/Natapadu-x86_64.AppImage
            dist/Natapadu-windows-amd64.exe
          generate_release_notes: true
          draft: false
