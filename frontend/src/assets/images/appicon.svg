<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b3350"/>
      <stop offset="55%" stop-color="#1c1f28"/>
      <stop offset="100%" stop-color="#12141a"/>
    </linearGradient>
    <linearGradient id="tool" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#a9b8ff"/>
      <stop offset="100%" stop-color="#4f6ef7"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Kunci pas: kepala cincin dengan rahang terbuka + gagang -->
    <mask id="wrench">
      <rect width="1024" height="1024" fill="#000"/>
      <circle cx="512" cy="312" r="156" fill="#fff"/>
      <rect x="450" y="300" width="124" height="470" rx="62" fill="#fff"/>
      <circle cx="512" cy="312" r="80" fill="#000"/>
      <polygon points="512,312 372,96 652,96" fill="#000"/>
    </mask>
  </defs>

  <!-- Latar kotak membulat ala ikon desktop -->
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#sheen)"/>
  <rect x="6" y="6" width="1012" height="1012" rx="224" fill="none"
        stroke="#ffffff" stroke-opacity="0.10" stroke-width="12"/>

  <!-- Batang data di belakang: master data -->
  <g fill="#4f6ef7" fill-opacity="0.32">
    <rect x="228" y="640" width="82" height="150" rx="28"/>
    <rect x="342" y="566" width="82" height="224" rx="28"/>
    <rect x="456" y="492" width="82" height="298" rx="28"/>
  </g>

  <g transform="rotate(38 512 470) translate(0 60)">
    <rect width="1024" height="1024" fill="url(#tool)" mask="url(#wrench)"/>
  </g>
</svg>
